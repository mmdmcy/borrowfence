name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang++, g++]
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ make
      - name: Test
        run: make CXX=${{ matrix.compiler }} test
      - name: Sanitizers
        if: matrix.compiler == 'clang++'
        run: make CXX=clang++ asan
      - name: Leak probes
        if: matrix.compiler == 'clang++'
        run: make CXX=clang++ leak-tests
